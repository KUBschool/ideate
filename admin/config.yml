# Decap CMS config for Ideate.
# Everything marked "⚠️ EDIT THIS" below needs your real values — see DEPLOY.md.

backend:
  name: github
  repo: kubschool/ideate   # ⚠️ EDIT THIS
  branch: main
  base_url: https://ideate-auth.bschoolweb.workers.dev     # ⚠️ EDIT THIS — see /oauth-proxy
  auth_endpoint: auth

# Gives every edit a draft → in review → ready pipeline as a GitHub pull
# request, instead of writing straight to main. Good default for a small
# editorial team; turn off later if it ever feels like overhead.
publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{topic}} · {{title}}"
    sortable_fields: ["date", "title", "topic"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Dek / subhead", name: "dek", widget: "text", hint: "One or two sentences. Shown on cards and at the top of the article."}
      - label: "Topic"
        name: "topic"
        widget: "select"
        options:
          - {label: "Accounting", value: "accounting"}
          - {label: "Finance", value: "finance"}
          - {label: "Supply Chain", value: "supply-chain"}
          - {label: "Marketing", value: "marketing"}
          - {label: "Information Systems", value: "information-systems"}
          - {label: "Analytics", value: "analytics"}
          - {label: "Entrepreneurship", value: "entrepreneurship"}
          - {label: "Management", value: "management"}
          - {label: "Business Law", value: "business-law"}
          - {label: "AI", value: "ai"}
          - {label: "Policy", value: "policy"}
      - label: "Faculty"
        name: "faculty"
        widget: "relation"
        collection: "faculty"
        multiple: true
        search_fields: ["full_name"]
        display_fields: ["full_name"]
        value_field: "{{slug}}"
        required: false
        hint: "Pick from the Faculty collection. Not listed yet? Add them under Faculty first, then come back and tag them here."
      - {label: "Byline (display text)", name: "byline", widget: "string", hint: "What shows in the meta line — usually the lead faculty name, or a department name for staff-written pieces."}
      - {label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - label: "Photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Upload a photo for this article — used on its card, its own page, and the homepage if it's the featured story. Landscape orientation works best; it gets cropped to fit a few different box shapes."
      - label: "Photo alt text"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Describe the photo for screen readers and for AI/search crawlers. Fill this in whenever you upload a photo."
      - {label: "Image tint (only used if no photo is uploaded)", name: "image_tint", widget: "select", options: ["steam", "limestone"], default: "steam"}
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, hint: "Only one article should be featured at a time — the newest featured one wins if more than one is flagged."}
      - {label: "Source URL", name: "source_url", widget: "string", required: false, hint: "If adapted from another article (e.g. business.ku.edu/news), link back to it here."}
      - label: "Research at a glance"
        name: "answer_box"
        widget: "text"
        required: false
        hint: "40–60 word answer-first summary — states the finding immediately. This is the GEO-friendly block; see the Story Editor prototype for how an AI-assisted draft of this gets generated and then edited before it's saved here."
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - {label: "Forthcoming", value: "forthcoming"}
        required: false
        hint: "Leave blank for normal published research. Use Forthcoming for research being discussed publicly, e.g. at a conference, before a journal has formally accepted it."
      - label: "Series"
        name: "series"
        widget: "select"
        multiple: true
        options:
          - {label: "Methods", value: "methodology"}
        required: false
        hint: "Optional cross-cutting lens, independent of Topic — e.g. Methods is for pieces about the tools and assumptions behind research itself, whatever the subject area."
      - label: "Journal"
        name: "journal"
        widget: "string"
        required: false
        hint: "The journal this research was published in, spelled exactly as it appears elsewhere on the site (check the Journals page or a faculty member's Editorial Service list for the exact spelling already in use) — e.g. \"Management Science\", not \"Mgmt. Science\". Leave blank if unknown; this powers the Journals index and each faculty member's Academic Journal Contributions list, and inconsistent spelling will split one journal into two entries."
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "faculty"
    label: "Faculty"
    label_singular: "Faculty Member"
    folder: "_faculty"
    create: true
    slug: "{{slug}}"
    identifier_field: "full_name"
    summary: "{{full_name}} — {{title}}"
    fields:
      - {label: "Full name", name: "full_name", widget: "string", hint: "As it appears on their business.ku.edu profile."}
      - {label: "Title", name: "title", widget: "string", hint: "Copy exactly from their business.ku.edu listing."}
      - {label: "Academic area", name: "academic_area", widget: "string", required: false}
      - {label: "KU Business profile URL", name: "profile_url", widget: "string", hint: "e.g. https://business.ku.edu/people/jane-doe"}
      - {label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a headshot, or paste the image URL from their business.ku.edu profile directly — either works."}
      - label: "Editorial Service"
        name: "editorial_service"
        widget: "list"
        required: false
        summary: "{{fields.role}} — {{fields.journal}}"
        hint: "One entry per editorial role. Most faculty have zero or one; a few have several. This is separate from — and not the same as — the journals they've published in, which is tracked automatically from each article's Journal field and doesn't need to be entered here."
        fields:
          - {label: "Role", name: "role", widget: "string", hint: "e.g. Editor-in-Chief, Associate Editor, Editorial Board Member — copy the exact title from the source listing."}
          - {label: "Journal", name: "journal", widget: "string", hint: "Spelled exactly as it appears elsewhere on the site — check the Journals page if unsure, since inconsistent spelling will split one journal into two entries."}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "About Page"
        name: "about"
        file: "_data/about.yml"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown", hint: "Add, remove, or edit paragraphs freely — same rich-text editor as article bodies."}
          - {label: "Contact prompt", name: "contact_prompt", widget: "string", hint: "The sentence right before the contact email."}
          - {label: "Contact email", name: "contact_email", widget: "string"}
      - label: "Header"
        name: "header"
        file: "_data/header.yml"
        fields:
          - {label: "Logo", name: "logo", widget: "image", required: false, hint: "Upload a logo, or leave blank to keep the text wordmark (Ideate.)."}
          - {label: "Logo (scrolled / dark background)", name: "logo_scrolled", widget: "image", required: false, hint: "Same logo with a light/reversed color treatment, shown once the header goes dark on scroll. Leave blank and the regular logo just stays put through the color change."}
          - label: "Accent color"
            name: "accent_color"
            widget: "select"
            options:
              - {label: "Kansas Blue (default)", value: "blue"}
              - {label: "Crimson", value: "crimson"}
              - {label: "Night", value: "night"}
            default: "blue"
            hint: "Controls buttons, links, and active nav states sitewide. Does not affect topic tag colors."
      - label: "Footer"
        name: "footer"
        file: "_data/footer.yml"
        fields:
          - {label: "Logo", name: "logo", widget: "image", required: false, hint: "This shows on the dark footer background — upload a light/white version if your logo has dark text. Leave blank to keep the text wordmark."}
          - {label: "About text", name: "about_text", widget: "text"}
          - label: "Social links"
            name: "social_links"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - label: "Icon"
                name: "platform"
                widget: "select"
                options: ["facebook", "instagram", "youtube", "linkedin"]
                required: false
                hint: "Picks the matching icon. Leave blank to show the label as plain text instead."
          - label: "Columns"
            name: "columns"
            widget: "list"
            hint: "Each column is a heading plus its own list of links."
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string", hint: "Full https:// URL, a mailto: link, or a site-relative path like /about/."}
          - {label: "Address", name: "address", widget: "string"}
          - label: "Legal links"
            name: "legal_links"
            widget: "list"
            hint: "The small links in the very bottom bar (Accessibility, Website support, etc.)."
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
      - label: "Just Announced Banner"
        name: "announcement"
        file: "_data/announcement.yml"
        fields:
          - {label: "Enabled", name: "enabled", widget: "boolean", default: true}
          - {label: "Text", name: "text", widget: "text"}
          - {label: "Link URL", name: "link", widget: "string"}
          - {label: "Link text", name: "link_text", widget: "string", default: "Read more"}
      - label: "Faculty & School Recognition"
        name: "awards"
        file: "_data/awards.yml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
