# Decap CMS config for Ideate.
# Everything marked "⚠️ EDIT THIS" below needs your real values — see DEPLOY.md.

backend:
  name: github
  repo: kubschool/ideate   # ⚠️ EDIT THIS
  branch: main
  base_url: https://ideate-auth.bschoolweb.workers.dev     # ⚠️ EDIT THIS — see /oauth-proxy
  auth_endpoint: auth

# Gives every edit a draft → in review → ready pipeline as a GitHub pull
# request, instead of writing straight to main. Good default for a small
# editorial team; turn off later if it ever feels like overhead.
publish_mode: editorial_workflow

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articles"
    label: "Articles"
    label_singular: "Article"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{topic}} · {{title}}"
    sortable_fields: ["date", "title", "topic"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Dek / subhead", name: "dek", widget: "text", hint: "One or two sentences. Shown on cards and at the top of the article."}
      - label: "Main topic"
        name: "topic"
        widget: "select"
        hint: "The topic this research mainly belongs to. It sets the story's color and is listed first. If the research also fits other topics, add them in \"Also relates to\" just below."
        options:
          - {label: "Accounting", value: "accounting"}
          - {label: "Finance", value: "finance"}
          - {label: "Supply Chain", value: "supply-chain"}
          - {label: "Marketing", value: "marketing"}
          - {label: "Information Systems", value: "information-systems"}
          - {label: "Analytics", value: "analytics"}
          - {label: "Entrepreneurship", value: "entrepreneurship"}
          - {label: "Management", value: "management"}
          - {label: "Business Law", value: "business-law"}
          - {label: "AI", value: "ai"}
          - {label: "Policy", value: "policy"}
      - label: "Also relates to"
        name: "also_topics"
        widget: "select"
        multiple: true
        max: 2
        required: false
        hint: "Optional. Up to two more topics this research also belongs to (so three topics at most, counting the main one). The story then also shows up on those topic pages and on the faculty member's profile. Don't repeat the main topic."
        options:
          - {label: "Accounting", value: "accounting"}
          - {label: "Finance", value: "finance"}
          - {label: "Supply Chain", value: "supply-chain"}
          - {label: "Marketing", value: "marketing"}
          - {label: "Information Systems", value: "information-systems"}
          - {label: "Analytics", value: "analytics"}
          - {label: "Entrepreneurship", value: "entrepreneurship"}
          - {label: "Management", value: "management"}
          - {label: "Business Law", value: "business-law"}
          - {label: "AI", value: "ai"}
          - {label: "Policy", value: "policy"}
      - label: "Faculty"
        name: "faculty"
        widget: "relation"
        collection: "faculty"
        multiple: true
        search_fields: ["full_name"]
        display_fields: ["full_name"]
        value_field: "{{slug}}"
        required: false
        hint: "Pick from the Faculty collection. Not listed yet? Add them under Faculty first, then come back and tag them here."
      - {label: "Byline (display text)", name: "byline", widget: "string", hint: "What shows in the meta line — usually the lead faculty name, or a department name for staff-written pieces."}
      - {label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - label: "Photo"
        name: "image"
        widget: "image"
        required: false
        hint: "Upload a photo for this article — used on its card, its own page, and the homepage if it's the featured story. Landscape orientation works best; it gets cropped to fit a few different box shapes."
      - label: "Photo alt text"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Describe the photo for screen readers and for AI/search crawlers. Fill this in whenever you upload a photo."
      - {label: "Image tint (only used if no photo is uploaded)", name: "image_tint", widget: "select", options: ["steam", "limestone"], default: "steam"}
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, hint: "Only one article should be featured at a time — the newest featured one wins if more than one is flagged."}
      - {label: "Source URL", name: "source_url", widget: "string", required: false, hint: "If adapted from another article (e.g. business.ku.edu/news), link back to it here."}
      - label: "Research at a glance"
        name: "answer_box"
        widget: "text"
        required: false
        hint: "40–60 word answer-first summary — states the finding immediately. This is the GEO-friendly block; see the Story Editor prototype for how an AI-assisted draft of this gets generated and then edited before it's saved here."
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - {label: "Forthcoming", value: "forthcoming"}
        required: false
        hint: "Leave blank for normal published research. Use Forthcoming for research being discussed publicly, e.g. at a conference, before a journal has formally accepted it."
      - label: "Series"
        name: "series"
        widget: "select"
        multiple: true
        options:
          - {label: "Methods", value: "methodology"}
        required: false
        hint: "Optional cross-cutting lens, independent of Topic — e.g. Methods is for pieces about the tools and assumptions behind research itself, whatever the subject area."
      - label: "Journal"
        name: "journal"
        widget: "string"
        required: false
        hint: "The journal this research was published in, spelled exactly as it appears elsewhere on the site (check the Journals page, Site Settings > Journals, or a faculty member's Editorial Service list for the exact spelling already in use) — e.g. \"Management Science\", not \"Mgmt. Science\". Leave blank if unknown; this powers the Journals index and each faculty member's Academic Journal Contributions list, and inconsistent spelling will split one journal into two entries."
      - label: "Journal article link"
        name: "journal_url"
        widget: "string"
        required: false
        pattern: ['^https?://', "Start with http:// or https:// — paste the full web address."]
        hint: "Optional. The web address of the original paper on the journal's or publisher's site (or its DOI link). It becomes the \"Journal article\" link on the Latest research cards on topic pages. Leave blank and that link simply doesn't appear. (Source URL above is something else — a page this story was adapted from.)"
      - {label: "Body", name: "body", widget: "markdown"}

  - name: "media"
    label: "Videos"
    label_singular: "Video"
    folder: "_media"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: ["date", "title", "topic"]
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Summary", name: "dek", widget: "text", hint: "One or two sentences on what the video covers — shown in the homepage/topic spotlight and at the top of the video's own page."}
      - label: "Research area"
        name: "topic"
        widget: "select"
        options:
          - {label: "Accounting", value: "accounting"}
          - {label: "Finance", value: "finance"}
          - {label: "Supply Chain", value: "supply-chain"}
          - {label: "Marketing", value: "marketing"}
          - {label: "Information Systems", value: "information-systems"}
          - {label: "Analytics", value: "analytics"}
          - {label: "Entrepreneurship", value: "entrepreneurship"}
          - {label: "Management", value: "management"}
          - {label: "Business Law", value: "business-law"}
          - {label: "AI", value: "ai"}
          - {label: "Policy", value: "policy"}
        required: false
        hint: "Optional. If set, this video becomes the featured video spotlighted on that topic's page. Leave blank for a general-interest video that only shows up on the homepage and the Videos hub."
      - label: "Faculty featured"
        name: "faculty"
        widget: "relation"
        collection: "faculty"
        multiple: true
        search_fields: ["full_name"]
        display_fields: ["full_name"]
        value_field: "{{slug}}"
        required: false
      - {label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true}
      - label: "Thumbnail"
        name: "thumbnail"
        widget: "image"
        hint: "Upload a still from the video (landscape works best). YouTube's auto-generated thumbnails are inconsistent quality, so the site uses this image instead, everywhere the video is teased."
      - label: "YouTube link"
        name: "video_url"
        widget: "string"
        hint: "Paste the normal YouTube link, either from the address bar (youtube.com/watch?v=...) or the Share button (youtu.be/...) — the site builds the lightweight embed from it automatically. This stays hosted on YouTube; nothing is uploaded to the site itself."
      - {label: "Feature on homepage", name: "featured", widget: "boolean", default: false, hint: "Only one video should be flagged at a time — the newest featured one wins if more than one is flagged. If none are flagged, the most recently published video is used automatically."}
      - {label: "Related article or source URL", name: "source_url", widget: "string", required: false, hint: "Optional — link to a related Ideate article or KU Business news post."}
      - {label: "Body", name: "body", widget: "markdown", required: false, hint: "Optional — additional context shown below the embedded video. Most videos won't need this."}

  - name: "faculty"
    label: "Faculty"
    label_singular: "Faculty Member"
    folder: "_faculty"
    create: true
    slug: "{{slug}}"
    identifier_field: "full_name"
    summary: "{{full_name}} — {{academic_area}}"
    fields:
      - {label: "Full name", name: "full_name", widget: "string", hint: "As it appears on their business.ku.edu profile."}
      - {label: "Title", name: "title", widget: "string", required: false, hint: "Rank or role only — e.g. \"Associate Professor\" or \"Dean.\" Leave blank if their business.ku.edu listing is just a named professorship with no separate rank given. Named professorships, fellowships, and endowed chairs go in the field below instead, not here."}
      - label: "Named Professorship(s)"
        name: "professorship"
        widget: "list"
        required: false
        field: {label: "Professorship", name: "name", widget: "string"}
        hint: "Endowed chairs and fellowships only — e.g. \"Larry D. Horner/KPMG Professor,\" \"Capitol Federal Fellow.\" Most faculty have zero or one; a couple have two. Center directorships and rank designations like \"Professor of the Practice\" go in Title instead, not here."
      - {label: "Academic area", name: "academic_area", widget: "string", required: false}
      - {label: "Short bio", name: "bio", widget: "text", required: false, hint: "One or two sentences, in the third person — e.g. \"Jane Doe is a professor of accounting whose research examines audit quality and financial reporting.\" Shown under their name on this profile page and in the Faculty spotlight on topic pages. Leave blank and it is simply left out."}
      - {label: "KU Business profile URL", name: "profile_url", widget: "string", hint: "e.g. https://business.ku.edu/people/jane-doe"}
      - {label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a headshot, or paste the image URL from their business.ku.edu profile directly — either works."}
      - label: "Editorial Service"
        name: "editorial_service"
        widget: "list"
        required: false
        summary: "{{fields.role}} — {{fields.journal}}"
        hint: "One entry per editorial role. Most faculty have zero or one; a few have several. This is separate from — and not the same as — the journals they've published in, which is tracked automatically from each article's Journal field and doesn't need to be entered here."
        fields:
          - {label: "Role", name: "role", widget: "string", hint: "e.g. Editor-in-Chief, Associate Editor, Editorial Board Member — copy the exact title from the source listing."}
          - {label: "Journal", name: "journal", widget: "string", hint: "Spelled exactly as it appears elsewhere on the site — check the Journals page or Site Settings > Journals if unsure, since inconsistent spelling will split one journal into two entries (and a misspelled premier journal won't get its Premier highlight)."}
      - label: "Featured research"
        name: "featured_article"
        widget: "relation"
        collection: "articles"
        search_fields: ["title"]
        display_fields: ["title"]
        value_field: "title"
        required: false
        hint: "Optional. Pick one Ideate story to spotlight in the Featured research tab of this profile. Tip: click the box and start typing to search articles by headline. Leave blank and that tab is hidden. (The Research tab always lists every story this person is tagged in.)"
      - label: "In the media"
        name: "media_appearances"
        widget: "list"
        required: false
        summary: "{{fields.type}} — {{fields.title}}"
        hint: "Videos, podcasts, news stories and other appearances outside Ideate. Shown in the In the media tab, in the order listed here (drag to reorder, newest first works well). Ideate videos this person is tagged in appear there automatically — don't re-enter those. Leave empty and the tab is hidden unless there is an Ideate video."
        fields:
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - {label: "News story or article", value: "article"}
              - {label: "Video", value: "video"}
              - {label: "Podcast", value: "podcast"}
              - {label: "Other", value: "other"}
            default: "article"
          - {label: "Title", name: "title", widget: "string", hint: "The headline or episode title."}
          - {label: "Outlet or source", name: "outlet", widget: "string", required: false, hint: "e.g. KU News, NPR, The Wall Street Journal, a podcast name."}
          - {label: "Link", name: "url", widget: "string", hint: "The full web address of the story, video or episode. It opens in a new tab."}
          - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false}
          - {label: "Short description", name: "description", widget: "text", required: false, hint: "Optional — one or two sentences. Plain text."}
          - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Optional. Landscape works best. Without one, the card gets a colored tile with an icon for its type."}

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "About Page"
        name: "about"
        file: "_data/about.yml"
        fields:
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown", hint: "Add, remove, or edit paragraphs freely — same rich-text editor as article bodies."}
          - {label: "Contact prompt", name: "contact_prompt", widget: "string", hint: "The sentence right before the contact email."}
          - {label: "Contact email", name: "contact_email", widget: "string"}
      - label: "Header"
        name: "header"
        file: "_data/header.yml"
        fields:
          - {label: "KU logo (top bar)", name: "ku_logo", widget: "image", required: false, hint: "The KU logo at the left of the light blue top bar, next to \"School of Business\". PNG or SVG — a one-color KU Blue (#0051ba) logo on a transparent background looks best, and it is shown about 25px tall. Leave blank to use the built-in KU logo."}
          - {label: "Ideate logo", name: "logo", widget: "image", required: false, hint: "Upload a logo, or leave blank to keep the text wordmark (Ideate.)."}
          - {label: "Ideate logo (scrolled / dark background)", name: "logo_scrolled", widget: "image", required: false, hint: "Same logo with a light/reversed color treatment, shown once the header goes dark on scroll. Leave blank and the regular logo just stays put through the color change."}
          - {label: "Subhead", name: "tagline", widget: "string", hint: "The short line shown to the right of the logo in the site header (it wraps onto two lines), e.g. \"KU Business insights that elevate business.\" On phones it sits under the logo."}
          - label: "Accent color"
            name: "accent_color"
            widget: "select"
            options:
              - {label: "Kansas Blue (default)", value: "blue"}
              - {label: "Crimson", value: "crimson"}
              - {label: "Night", value: "night"}
            default: "blue"
            hint: "Controls buttons, links, and active nav states sitewide. Does not affect topic tag colors."
      - label: "Footer"
        name: "footer"
        file: "_data/footer.yml"
        fields:
          - {label: "Logo", name: "logo", widget: "image", required: false, hint: "This shows on the dark footer background — upload a light/white version if your logo has dark text. Leave blank to keep the text wordmark."}
          - {label: "About text", name: "about_text", widget: "text"}
          - label: "Social links"
            name: "social_links"
            widget: "list"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
              - label: "Icon"
                name: "platform"
                widget: "select"
                options: ["facebook", "instagram", "youtube", "linkedin"]
                required: false
                hint: "Picks the matching icon. Leave blank to show the label as plain text instead."
          - label: "Columns"
            name: "columns"
            widget: "list"
            hint: "Each column is a heading plus its own list of links."
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string", hint: "Full https:// URL, a mailto: link, or a site-relative path like /about/."}
          - {label: "Address", name: "address", widget: "string"}
          - label: "Legal links"
            name: "legal_links"
            widget: "list"
            hint: "The small links in the very bottom bar (Accessibility, Website support, etc.)."
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}
      - label: "Just Announced Banner"
        name: "announcement"
        file: "_data/announcement.yml"
        fields:
          - {label: "Enabled", name: "enabled", widget: "boolean", default: true}
          - {label: "Text", name: "text", widget: "text"}
          - {label: "Link URL", name: "link", widget: "string"}
          - {label: "Link text", name: "link_text", widget: "string", default: "Read more"}
      - label: "Faculty & School Recognition"
        name: "awards"
        file: "_data/awards.yml"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
      - label: "Journals (premier flags)"
        name: "journals"
        file: "_data/journals.yml"
        fields:
          - label: "Journals"
            name: "items"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Journal"
            summary: "{{fields.name}}{{fields.premier | ternary(' ★ Premier','')}}"
            hint: "One row per journal; a ★ next to a name means it's flagged premier. Check \"Premier journal\" to give a journal the bold name, highlighted box, and badge on the Journals page and include it in the Premier filter. This list does not control which journals appear on the Journals page — that still happens automatically from article Journal fields and faculty Editorial Service entries — so rows for journals nobody has used yet are fine (they just wait). A journal with no row here is treated as not premier; to flag a new one, add a row (it goes to the top) with the name spelled exactly as it appears on the article or Editorial Service entry (capitalization doesn't matter, everything else does)."
            fields:
              - {label: "Journal name", name: "name", widget: "string", hint: "Exactly as it's spelled on articles and in Editorial Service."}
              - {label: "Premier journal", name: "premier", widget: "boolean", default: false, hint: "Checked = bold name, highlighted box, and Premier badge on the Journals page. The list started from the Financial Times FT50; School leadership additions are checked the same way."}
              - label: "Why it's premier (internal note)"
                name: "basis"
                widget: "select"
                required: false
                options:
                  - {label: "FT50", value: "ft50"}
                  - {label: "Added by School leadership", value: "leadership"}
                hint: "Optional, never shown on the site. Just a record of where the flag came from."
      - label: "Topic pages"
        name: "topic_pages"
        file: "_data/topic_pages.yml"
        fields:
          - label: "Topics"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Topic page"
            summary: "{{fields.topic}}"
            hint: "One row per topic, controlling that topic's page (Accounting, Finance, and so on). Open a topic to set its section header, featured story, stats call-out and faculty spotlight. Every field is optional — leave one blank and the page uses a sensible default (noted under each field)."
            fields:
              - label: "Topic"
                name: "topic"
                widget: "select"
                options:
                  - {label: "Accounting", value: "accounting"}
                  - {label: "Finance", value: "finance"}
                  - {label: "Supply Chain", value: "supply-chain"}
                  - {label: "Marketing", value: "marketing"}
                  - {label: "Information Systems", value: "information-systems"}
                  - {label: "Analytics", value: "analytics"}
                  - {label: "Entrepreneurship", value: "entrepreneurship"}
                  - {label: "Management", value: "management"}
                  - {label: "Business Law", value: "business-law"}
                  - {label: "AI", value: "ai"}
                  - {label: "Policy", value: "policy"}
                hint: "Which topic page this row controls. Each topic should appear once."
              - {label: "Header subhead", name: "subhead", widget: "text", required: false, hint: "One or two sentences under the topic name in the large section header — a good place to call out how prominent KU's research is in this area. Leave blank to show the topic's standard one-line description."}
              - label: "Header image"
                name: "header_image"
                widget: "image"
                required: false
                hint: "Shown on the right side of the header, fading out toward the text. Wide, fairly simple images work best (the left edge dissolves away). Leave blank for a soft patterned placeholder."
              - label: "Header background"
                name: "header_tone"
                widget: "select"
                options:
                  - {label: "Steam (default)", value: "steam"}
                  - {label: "Light blue", value: "sky"}
                  - {label: "Plain white", value: "white"}
                default: "steam"
                hint: "The color the header image fades into."
              - {label: "Show featured story", name: "show_feature", widget: "boolean", default: true, hint: "On: a large featured story sits under the header, with the stats or articles below beside it. Off: that whole block is hidden and those articles flow into the cards and list instead."}
              - label: "Featured story"
                name: "feature_article"
                widget: "relation"
                collection: "articles"
                search_fields: ["title"]
                display_fields: ["title"]
                value_field: "title"
                required: false
                hint: "Optional — pick an article from this topic to feature. Tip: click the box and start typing to search articles by headline. Leave blank to feature the topic's newest article automatically."
              - label: "Beside the featured story"
                name: "side"
                widget: "select"
                options:
                  - {label: "Stats call-out (set below)", value: "stats"}
                  - {label: "Three articles", value: "articles"}
                  - {label: "Nothing", value: "none"}
                default: "articles"
                hint: "What appears next to the featured story."
              - label: "Three articles (if showing articles)"
                name: "side_articles"
                widget: "relation"
                collection: "articles"
                multiple: true
                max: 3
                search_fields: ["title"]
                display_fields: ["title"]
                value_field: "title"
                required: false
                hint: "Optional — pick up to three articles from this topic. Tip: click the box and start typing to search articles by headline. Leave blank to show the next three newest automatically."
              - {label: "Stats call-out: title", name: "stats_title", widget: "string", required: false, hint: "e.g. \"Accounting at KU Business\""}
              - label: "Stats call-out: stats"
                name: "stats"
                widget: "list"
                required: false
                summary: "{{fields.value}} — {{fields.label}}"
                hint: "Short, strong figures — a big value and a one-line label each."
                fields:
                  - {label: "Value", name: "value", widget: "string", hint: "e.g. \"No. 1\" or \"$4.2M\""}
                  - {label: "Label", name: "label", widget: "string", hint: "What the value measures, with source and year if it's a ranking."}
              - {label: "Stats call-out: note", name: "stats_note", widget: "text", required: false, hint: "Optional small print under the stats."}
              - label: "Faculty spotlight"
                name: "spotlight"
                widget: "relation"
                collection: "faculty"
                search_fields: ["full_name"]
                display_fields: ["full_name"]
                value_field: "{{slug}}"
                required: false
                hint: "Optional. Pick a faculty member to spotlight: the spotlight takes two-thirds of the width beside the topic's video (one-third). Shows their photo, name, position, short bio (a field on their Faculty profile) and their three most recent articles. Leave blank to run the video full width instead."
      - label: "Expert call-out"
        name: "expert_callout"
        file: "_data/expert_callout.yml"
        fields:
          - {label: "Enabled", name: "enabled", widget: "boolean", default: true, hint: "Turn off to hide the \"Connect with our experts\" call-out on every topic page."}
          - {label: "Small heading above the title", name: "kicker", widget: "string", required: false, hint: "e.g. \"Ask the experts\". Leave blank to omit."}
          - {label: "Heading", name: "heading", widget: "string", hint: "e.g. \"Connect with our experts\""}
          - {label: "Text", name: "body", widget: "text", required: false, hint: "One or two sentences."}
          - {label: "Button label", name: "button_label", widget: "string", default: "Contact us"}
          - {label: "Button link", name: "button_url", widget: "string", hint: "A site path like /contact/ or a full https:// link. Point this at the contact page (with the Qualtrics form) once it exists."}
