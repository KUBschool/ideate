<div class="parent-bar">
  <div class="wrap">
    <a href="https://business.ku.edu">business.ku.edu</a>
    <a href="https://ku.edu">The University of Kansas</a>
  </div>
</div>

<header class="site-header">
  <div class="wrap">
    <div>
      <a href="{{ '/' | relative_url }}" class="wordmark">{{ site.title }}<span class="dot">.</span></a>
      <span class="tagline">{{ site.tagline }}</span>
    </div>
    <nav class="primary-nav">
      <a href="{{ '/' | relative_url }}">Articles</a>

      {% if site.sections.podcasts %}
        <a href="{{ '/podcasts/' | relative_url }}">Podcasts</a>
      {% else %}
        <a href="#" class="muted" title="Coming soon">Podcasts</a>
      {% endif %}

      {% if site.sections.webinars %}
        <a href="{{ '/webinars/' | relative_url }}">Webinars</a>
      {% else %}
        <a href="#" class="muted" title="Coming soon">Webinars</a>
      {% endif %}

      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/#newsletter' | relative_url }}" class="btn-subscribe">Subscribe</a>
    </nav>
  </div>
</header>
