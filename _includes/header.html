<div class="parent-bar">
  <div class="wrap">
    <a href="https://business.ku.edu">business.ku.edu</a>
    <a href="https://ku.edu">The University of Kansas</a>
  </div>
</div>

<header class="site-header">
  <div class="wrap">
    <div>
      {% if site.data.header.logo %}
        <a href="{{ '/' | relative_url }}">
          <img src="{% if site.data.header.logo contains '://' %}{{ site.data.header.logo }}{% else %}{{ site.data.header.logo | relative_url }}{% endif %}" alt="{{ site.title }}" class="site-logo">
        </a>
      {% else %}
        <a href="{{ '/' | relative_url }}" class="wordmark">{{ site.title }}<span class="dot">.</span></a>
      {% endif %}
      <span class="tagline">{{ site.tagline }}</span>
    </div>
    <nav class="primary-nav">
      <a href="{{ '/' | relative_url }}">Articles</a>
      <a href="{{ '/faculty/' | relative_url }}">Faculty</a>

      {% if site.sections.podcasts %}
        <a href="{{ '/podcasts/' | relative_url }}">Podcasts</a>
      {% endif %}

      {% if site.sections.webinars %}
        <a href="{{ '/webinars/' | relative_url }}">Webinars</a>
      {% endif %}

      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/subscribe/' | relative_url }}" class="btn-subscribe">Subscribe</a>
    </nav>
  </div>
</header>
