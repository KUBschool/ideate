{% assign active_topic = page.nav_active | default: page.topic | default: 'all' %}
{% assign sorted_topics = site.data.topics | sort_natural: 'name' %}
<nav class="topic-nav" aria-label="Browse by topic">
  <div class="wrap topic-nav-inner">
    <span class="topic-nav-label" id="topic-nav-label">Find research on:</span>
    <div class="topic-scroller" id="topic-scroller">
      <button type="button" class="scroll-btn scroll-prev" id="topic-prev" aria-label="Scroll topics left" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="topic-track" id="topic-track" role="group" aria-labelledby="topic-nav-label">
        <a href="{{ '/' | relative_url }}" class="topic-pill{% if active_topic == 'all' %} active{% endif %}">All</a>
        <a href="{{ '/forthcoming/' | relative_url }}" class="topic-pill pill-forthcoming{% if active_topic == 'forthcoming' %} active{% endif %}">Forthcoming</a>
        <a href="{{ '/methods/' | relative_url }}" class="topic-pill pill-methods{% if active_topic == 'methodology' %} active{% endif %}">Methods</a>
        {% for topic in sorted_topics %}
        <a href="{{ '/topics/' | append: topic.slug | append: '/' | relative_url }}"
           class="topic-pill{% if active_topic == topic.slug %} active{% endif %}">{{ topic.name }}</a>
        {% endfor %}
      </div>
      <button type="button" class="scroll-btn scroll-next" id="topic-next" aria-label="Scroll topics right" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</nav>
