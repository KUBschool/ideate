heading: About Ideate
body: >-
  Ideate is the digital research publication of the University of Kansas School
  of Business. Through cutting-edge scholarship, KU Business faculty generate
  insights that inform business practice, shape public policy and address the
  complex challenges facing organizations and communities.


  The mission of Ideate is to make that research accessible beyond academic journals and conference presentations. Translating faculty expertise into engaging articles, videos and podcasts, connects research with the people who can put it to work.


  Reflecting the collaborative spirit of the KU School of Business, Ideate showcases research that is often cross-disciplinary and challenges conventional boundaries. Through Ideate, we share the ideas, discoveries and perspectives that help make business better for Kansas and beyond.
