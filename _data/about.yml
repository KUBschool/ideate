heading: "About Ideate"
body: |
  Ideate is the research magazine of the University of Kansas School of Business —
  the successor to our print and email research publication, reimagined for the web.
  We cover faculty research across accounting, finance, marketing, analytics,
  entrepreneurship, information systems, supply chain, business law, AI and policy,
  written for readers who want the finding, not just the abstract.

  KU Business's academic experience — from undergraduate through the PhD — is built
  on the idea that business problems don't respect departmental lines. Ideate exists
  to show that same cross-disciplinary thinking in the research our faculty produce.
contact_prompt: "Have a research finding, faculty accolade, or story tip? Email the editors at"
contact_email: "bschoolinfo@ku.edu"
