# Journals — premier flags. Edited in the CMS under Site Settings > Journals.
#
# This file only decides which journals get the 'Premier' treatment on the
# Journals page. The page's journal list itself is still built automatically
# from article Journal fields and faculty Editorial Service entries, so a row
# here for a journal nobody has used yet is harmless (it just waits). A journal
# with no row here is simply treated as not premier. Names match without
# regard to capitalization but must otherwise be spelled exactly alike.
#
# Pre-loaded with every journal in the system as of the 2026-10-07 backup,
# plus the Financial Times FT50 (2026 revision), with the FT50 pre-checked.
